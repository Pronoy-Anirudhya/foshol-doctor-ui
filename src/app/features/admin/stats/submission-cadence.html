<h2 class="text-base font-semibold text-ink">{{ 'admin.cadence.title' | translate }}</h2>
<p class="mt-1 max-w-prose text-sm text-ink-muted">{{ 'admin.cadence.subtitle' | translate }}</p>

<figure class="sc-figure" role="img" [attr.aria-label]="ariaLabel()">
  @if (hasLine()) {
    <div class="sc-plot">
      <!-- preserveAspectRatio="none" is what makes the line fill its box at any width; it is
           also why nothing but the polyline lives in here. Strokes survive it via
           vector-effect; circles and text do not survive it at all. -->
      <svg
        class="sc-svg"
        [attr.viewBox]="viewBox"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <polygon class="sc-area" [attr.points]="areaPoints()" />
        <polyline
          class="sc-line"
          data-testid="sc-line"
          [attr.points]="linePoints()"
          vector-effect="non-scaling-stroke"
        />
      </svg>

      <!-- Every dot and label is an HTML sibling, positioned from a percentage property. -->
      @for (dot of dots(); track dot.index) {
        <span
          class="sc-dot"
          data-testid="sc-dot"
          [attr.data-peak]="dot.peak || null"
          [style.--sc-x]="dot.x"
          [style.--sc-y]="dot.y"
        ></span>
      }
    </div>

    <div class="sc-axis">
      <span data-testid="sc-from">{{ fromDate() | dhakaDateTime }}</span>
      <span data-testid="sc-to">{{ toDate() | dhakaDateTime }}</span>
    </div>
  } @else {
    <!-- Too few timestamps, or a window with no width. The summary below is the whole answer. -->
    <p class="sc-empty" data-testid="sc-no-line">{{ 'admin.cadence.noLine' | translate }}</p>
  }

  <figcaption class="sc-caption" data-testid="sc-caption">
    <span>{{ 'admin.cadence.summary' | translate: summaryParams() }}</span>
    @if (fromDate() && toDate()) {
      <span data-testid="sc-window">
        {{
          'admin.cadence.window'
            | translate: { from: fromDate() | dhakaDateTime, to: toDate() | dhakaDateTime }
        }}
      </span>
    }
    @if (hasLine()) {
      <span class="sc-peak">{{ 'admin.cadence.peak' | translate: peakParams() }}</span>
    }
  </figcaption>
</figure>

<!-- The ordering is the honesty of this widget: the sample is biased, and says so. -->
<p class="mt-3 max-w-prose text-xs text-ink-faint">{{ 'admin.cadence.ordering' | translate }}</p>
