<foshol-page-heading
  eyebrowKey="farmers.eyebrow"
  titleKey="farmers.title"
  [subtitleText]="districtLabel() ? ('farmers.subtitle' | translate: { district: districtLabel() }) : ('farmers.subtitleNoDistrict' | translate)"
/>

<!-- The two writes this surface makes (WEB-FR-303). Both open a dialog; neither navigates, so a
     half-typed registration is never lost to a route change. -->
<div class="mt-4 flex flex-wrap gap-2">
  <button
    #registerButton
    type="button"
    class="touch-target inline-flex items-center gap-2 rounded-control bg-primary px-5 font-semibold text-on-primary shadow-card transition-colors duration-1 ease-settle hover:bg-primary-hover hover:shadow-lift"
    data-testid="farmers-open-register"
    (click)="openRegister()"
  >
    {{ 'farmers.action.register' | translate }}
  </button>
  <button
    #importButton
    type="button"
    class="touch-target inline-flex items-center gap-2 rounded-control border border-surface-3 bg-surface-0 px-4 text-sm font-medium text-ink transition-colors duration-1 ease-settle hover:bg-surface-1"
    data-testid="farmers-open-import"
    (click)="openImport()"
  >
    {{ 'farmers.action.import' | translate }}
  </button>
</div>

<foshol-farmer-directory-section class="mt-6 block" />

<foshol-farmer-register-dialog
  [open]="registerOpen()"
  (closed)="closeRegister()"
  (registered)="onWrote()"
/>

<foshol-farmer-import-dialog [open]="importOpen()" (closed)="closeImport()" (imported)="onWrote()" />
