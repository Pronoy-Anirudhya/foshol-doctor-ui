<span class="sr-only">{{ 'badge.source.label' | translate }}</span>

<svg class="cs-glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
  @switch (source()) {
    @case ('MODEL') {
      <!-- A die with legs: the machine's own output. -->
      <rect
        x="4.6"
        y="4.6"
        width="6.8"
        height="6.8"
        rx="1.4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
      />
      <path
        d="M6.4 2.2v2.4M9.6 2.2v2.4M6.4 11.4v2.4M9.6 11.4v2.4M2.2 6.4h2.4M2.2 9.6h2.4M11.4 6.4h2.4M11.4 9.6h2.4"
        stroke="currentColor"
        stroke-width="1.2"
        stroke-linecap="round"
      />
    }
    @case ('KB') {
      <!-- An open book: the curated, human-owned knowledge base. -->
      <path
        d="M8 4.3C6.7 3.2 4.9 2.9 2.6 3.2v9c2.3-.3 4.1 0 5.4 1.1 1.3-1.1 3.1-1.4 5.4-1.1v-9c-2.3-.3-4.1 0-5.4 1.1z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      <path d="M8 4.3v9" stroke="currentColor" stroke-width="1.4" />
    }
    @case ('MERGED') {
      <!-- Two streams becoming one. -->
      <path
        d="M2.4 3.4c3.4 0 3.4 4.6 6.2 4.6M2.4 12.6c3.4 0 3.4-4.6 6.2-4.6"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />
      <path d="M8.6 8h4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      <path
        d="M11.4 5.8 13.6 8l-2.2 2.2"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
  }
</svg>

<span class="cs-text">{{ labelKey() | translate }}</span>
