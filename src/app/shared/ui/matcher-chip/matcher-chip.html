<span class="sr-only">{{ 'badge.matcher.label' | translate }}</span>

<svg class="mc-glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
  @switch (matcher()) {
    @case ('VECTOR') {
      <!-- Points in a space, joined: an embedding neighbourhood. -->
      <path
        d="M3.6 11.4 8 4.2l4.4 7.2"
        fill="none"
        stroke="currentColor"
        stroke-width="1.3"
        stroke-linejoin="round"
      />
      <circle cx="8" cy="4.2" r="1.9" fill="currentColor" />
      <circle cx="3.6" cy="11.4" r="1.6" fill="currentColor" />
      <circle cx="12.4" cy="11.4" r="1.6" fill="currentColor" />
    }
    @case ('FUZZY') {
      <!-- Approximate: two waves that nearly, but do not quite, line up. -->
      <path
        d="M1.6 5.6c1.6-2.2 3.2-2.2 4.8 0s3.2 2.2 4.8 0 3.2-2.2 3.2 0"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />
      <path
        d="M1.6 10.4c1.6-2.2 3.2-2.2 4.8 0s3.2 2.2 4.8 0 3.2-2.2 3.2 0"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-dasharray="2.4 2"
      />
    }
    @case ('MANUAL') {
      <!-- A person put this here. -->
      <circle cx="8" cy="5" r="2.7" fill="none" stroke="currentColor" stroke-width="1.4" />
      <path
        d="M2.9 14c0-2.8 2.3-4.4 5.1-4.4s5.1 1.6 5.1 4.4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />
    }
  }
</svg>

<span class="mc-text">{{ labelKey() | translate }}</span>

<span class="mc-score" data-testid="matcher-score">
  <span class="sr-only">{{ 'badge.matcher.score' | translate }}</span>
  {{ scoreText() }}
</span>
