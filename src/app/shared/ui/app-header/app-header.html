<header
  class="sticky top-0 z-40 w-full shadow-card"
  [class]="barClass()"
  [attr.aria-label]="'shared.header.label' | translate"
>
  <div class="mx-auto flex w-full max-w-[110rem] items-center gap-3 px-4 py-2.5 md:gap-5 md:px-6">
    <!-- Product mark: a leaf whose midrib is a pulse trace — crop, and its health. Links home,
         home being whichever surface this signed-in role owns (WEB-FR-001's HOME_BY_ROLE). -->
    <a
      [routerLink]="homePath()"
      class="flex min-w-0 items-center gap-2.5 rounded-lg transition-transform duration-2 ease-settle hover:scale-[1.02] active:scale-[0.98]"
      [attr.aria-label]="'shared.brand.homeAria' | translate"
    >
      <svg
        viewBox="0 0 40 40"
        class="h-9 w-9 shrink-0 md:h-10 md:w-10"
        role="img"
        aria-hidden="true"
      >
        <path
          d="M33.5 5.5C33.5 22 22.6 33.4 6 33.4C6 16.9 16.9 5.5 33.5 5.5Z"
          [attr.fill]="tone() === 'dark' ? 'var(--color-paddy-500)' : 'var(--color-paddy-600)'"
        />
        <path
          d="M10.5 24.4h4.2l2.6-5.6 3.4 10.1 2.4-6.2h4.4"
          fill="none"
          stroke="var(--color-ink-invert)"
          stroke-width="2.1"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M6 33.4C13.8 27.8 22.4 19.6 30.6 9"
          fill="none"
          stroke="var(--color-paddy-800)"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-opacity="0.55"
        />
      </svg>

      <span class="flex min-w-0 flex-col leading-tight">
        <span class="truncate text-base font-bold md:text-lg">{{ 'app.title' | translate }}</span>
        <span class="hidden truncate text-xs lg:block" [class]="mutedClass()">
          {{ 'app.tagline' | translate }}
        </span>
      </span>
    </a>

    <div class="ms-auto flex items-center gap-2 md:gap-3">
      @if (authenticated()) {
        <foshol-sse-indicator [tone]="tone()" />
      }

      <foshol-lang-toggle [tone]="tone()" />

      @if (authenticated()) {
        <div class="hidden min-w-0 flex-col items-end leading-tight sm:flex">
          <span class="sr-only">{{ 'shared.header.signedInAs' | translate }}</span>
          <span class="truncate text-sm font-semibold">{{ identity() }}</span>
          @if (roleKey()) {
            <span class="truncate text-xs" [class]="mutedClass()">{{ roleKey() | translate }}</span>
          }
        </div>

        <button
          type="button"
          class="touch-target inline-flex items-center justify-center gap-2 rounded-xl border px-3 text-sm font-medium transition-colors duration-1 ease-settle"
          [class]="signOutClass()"
          [attr.aria-label]="'shared.header.signOut' | translate"
          (click)="signOut()"
        >
          <svg viewBox="0 0 20 20" class="h-4 w-4 shrink-0" aria-hidden="true" fill="none">
            <path
              d="M8 3.5H5.2A1.7 1.7 0 0 0 3.5 5.2v9.6A1.7 1.7 0 0 0 5.2 16.5H8"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
            <path
              d="M12.5 13.5 16 10l-3.5-3.5M16 10H7.5"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="hidden md:inline">{{ 'shared.header.signOut' | translate }}</span>
        </button>
      }
    </div>
  </div>
</header>
