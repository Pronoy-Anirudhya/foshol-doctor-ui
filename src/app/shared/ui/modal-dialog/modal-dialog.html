<!-- A full-bleed sheet on a phone, a centred panel from `sm` up. The switch is Tailwind
     variants on the element itself, never a media query in the stylesheet (WEB-UX-034). -->
<dialog
  #dialog
  class="md-dialog m-0 h-dvh max-h-dvh w-screen max-w-none border-0 bg-transparent p-0 text-ink sm:m-auto sm:h-auto sm:max-h-[calc(100dvh-4rem)] sm:w-auto sm:max-w-[min(48rem,calc(100vw-2rem))]"
  [attr.aria-labelledby]="headingId()"
  (close)="closed.emit()"
>
  <!-- `@if` keeps the body out of the DOM while shut, so a form inside starts fresh on each
       open rather than holding the previous attempt's values and validation state. -->
  @if (open()) {
    <div
      class="flex h-full w-full flex-col bg-surface-0 shadow-lift sm:h-auto sm:max-h-[calc(100dvh-4rem)] sm:rounded-panel sm:border sm:border-surface-3"
    >
      <!-- `flex-none`: the heading stays put while a long import result scrolls beneath it. -->
      <header class="flex flex-none items-center justify-between gap-3 border-b border-surface-3 px-5 py-4">
        <h2 [id]="headingId()" class="text-lg font-bold text-ink">{{ titleKey() | translate }}</h2>
        <button
          type="button"
          class="touch-target inline-flex w-11 items-center justify-center rounded-control border border-surface-3 bg-surface-0 text-ink transition-colors duration-1 ease-settle hover:bg-surface-1"
          data-testid="modal-close"
          [attr.aria-label]="'shared.modal.close' | translate"
          (click)="requestClose()"
        >
          <foshol-icon name="close" size="sm" />
        </button>
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto p-5">
        <ng-content />
      </div>
    </div>
  }
</dialog>
