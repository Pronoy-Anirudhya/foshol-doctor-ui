<span class="sr-only">{{ 'badge.analysisMode.label' | translate }}</span>

@switch (mode()) {
  @case ('LIVE') {
    <!-- A dot that breathes. Motion is off under prefers-reduced-motion, where the ring and
         the text label still carry the whole meaning. -->
    <span class="am-live" aria-hidden="true"><span class="am-live-dot"></span></span>
  }
  @case ('REPLAY') {
    <svg class="am-glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <!-- Stacked records: something taken off a shelf, not something happening now. -->
      <ellipse
        cx="8"
        cy="4"
        rx="5.5"
        ry="2.1"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
      />
      <path
        d="M2.5 4v4c0 1.16 2.46 2.1 5.5 2.1s5.5-.94 5.5-2.1V4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
      />
      <path
        d="M2.5 8v4c0 1.16 2.46 2.1 5.5 2.1s5.5-.94 5.5-2.1V8"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
      />
    </svg>
  }
}

<span class="am-text">{{ labelKey() | translate }}</span>
