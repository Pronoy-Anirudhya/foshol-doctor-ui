proxy_http_version 1.1;

# Keepalive upstream; blanking Connection stops a hop-by-hop header leaking through.
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# ── The one that is easy to get wrong ───────────────────────────────────────────────────────
# The browser now believes these calls are same-origin, so it sends no Origin on GET but DOES send
# one on every POST/PUT/PATCH/DELETE. The backend's allow-list is http://localhost:4200, so a
# forwarded Origin is a 403 on every case submission while every GET keeps working.
#
# Stripping it is safe HERE and only here: the JWT travels as a header, never a cookie, and every
# fetch in this app sets credentials:'omit'. There is no ambient credential for CSRF to ride on,
# so Origin is carrying no security signal to discard.
proxy_set_header Origin "";

# GET /cases/{id}/gradcam answers 302 into the object store on a DIFFERENT host. That Location
# must reach the browser untouched; rewriting it would point the overlay back at us.
proxy_redirect off;

proxy_connect_timeout 5s;
