# Foshol Doctor — frontend. One service, deliberately.
#
# ON `depends_on`: there is nothing here to depend on, and that is architectural rather than an
# oversight. The backend micro-services, MinIO and the Python ASR sidecar run on a SEPARATE VM;
# this file describes the frontend VM only, and BACKEND_API_BASE_URL points across the network at
# that other host. `depends_on` can name services in this same file and nothing else, so adding one
# would mean inventing a backend service here that does not and must not exist — a lie that would
# also make `docker compose up` wait on a container that never starts. If the backend is ever
# co-located, add it below and `depends_on: { api: { condition: service_healthy } }` becomes real.
#
#   cp .env.template .env   # then edit BACKEND_API_BASE_URL
#   docker compose up -d --build
#
# Changing BACKEND_API_BASE_URL in .env and re-running `docker compose up -d` retargets the running
# container. The Angular bundle is never rebuilt: the value is consumed by nginx's proxy_pass, and
# the browser only ever talks to this container's own origin.

name: foshol-doctor-ui

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUN_VERIFY: ${RUN_VERIFY:-false}
    image: ${IMAGE_NAME:-foshol-doctor-ui}:${IMAGE_TAG:-local}
    container_name: foshol-doctor-ui

    env_file:
      - .env

    environment:
      # Pin exactly which names envsubst may touch in the nginx template, so an unrelated variable
      # in .env can never rewrite part of the config. The trailing $$ is a literal $ after Compose
      # interpolation — it anchors the regex rather than referencing a variable.
      NGINX_ENVSUBST_FILTER: "^(BACKEND_API_BASE_URL|NGINX_CLIENT_MAX_BODY_SIZE|API_PROXY_READ_TIMEOUT|SSE_PROXY_READ_TIMEOUT)$$"
      TZ: ${TZ:-Asia/Dhaka}

    ports:
      # Container listens on 8080 as a non-root user; the host side is yours to choose. Set
      # HTTP_BIND_ADDRESS=127.0.0.1 when a host TLS terminator sits in front of this.
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"

    networks:
      - edge

    restart: unless-stopped
    stop_grace_period: 30s

    # nginx only. Deliberately does NOT probe the backend: a backend outage must never restart or
    # unhealth the frontend, and the app is genuinely usable with the API down.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Runs as uid/gid 101 from the unprivileged base image. No capability is needed because nothing
    # binds a port below 1024 inside the container.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # mode=1777 on every one of these is required, not decorative: a tmpfs mounts root-owned 0755
    # by default, and this container runs as uid 101, so envsubst cannot write the rendered config
    # and nginx cannot spool a request body. The sticky bit keeps it to the one process that is
    # here anyway, under cap_drop: ALL.
    tmpfs:
      # nginx.pid, and the security-headers snippet the entrypoint renders.
      - /tmp:size=16m,mode=1777
      # envsubst writes the rendered server block here.
      - /etc/nginx/conf.d:size=1m,mode=1777
      # client_body_temp / proxy_temp. Sized above client_max_body_size so a 32 MiB case submission
      # spools to disk rather than failing with "no space left on device".
      - /var/cache/nginx:size=128m,mode=1777
      - /var/run:size=1m,mode=1777

    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1.0}"
          memory: ${MEMORY_LIMIT:-256M}
        reservations:
          memory: ${MEMORY_RESERVATION:-64M}

    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

    # Uncomment when the backend is reachable by a name this VM cannot resolve. nginx resolves
    # proxy_pass at CONFIG LOAD, so an unresolvable hostname stops the container from starting
    # rather than failing at the first request — which is the better of the two failures, but only
    # if you know that is what happened.
    # extra_hosts:
    #   - "foshol-api:10.0.0.12"

networks:
  edge:
    driver: bridge
